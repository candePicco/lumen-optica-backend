[project]
name = "lumen-optica"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "candePicco", email = "candela.picco@itecriocuarto.org.ar" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "drf-spectacular-sidecar>=2026.10.1",
    "gunicorn>=26.2.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[project.scripts]
lumen-optica = "lumen_optica:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
